<section class="contact-page">
    <div class="contact-shell">
        <div class="contact-intro">
            <h1>Need help with your scheduling process?</h1>

            <p>
                Contact us for questions about schedule generation, data management,
                department setup, or technical support.
            </p>

            <div class="contact-info">
                <div>
                    <i class="bi bi-envelope"></i>
                    <span>{{ "adenita.luta@gmail.com" }}</span>
                </div>

                <div>
                    <i class="bi bi-clock"></i>
                    <span>Monday–Friday, 09:00–17:00</span>
                </div>

                <div>
                    <i class="bi bi-building"></i>
                    <span>Built for university departments</span>
                </div>
            </div>
        </div>

        <div class="contact-card">
            <div class="card-glow"></div>

            <form class="contact-form">
                <div class="form-header">
                    <p>Send a message</p>
                    <h2>We’ll help you get started</h2>
                </div>

                <div class="form-grid">
                    <label>
                        Full name
                        <input type="text" placeholder="Your name" />
                    </label>

                    <label>
                        Email address
                        <input type="email" placeholder="you@example.com" />
                    </label>
                </div>

                <label>
                    Department / Institution
                    <input type="text" placeholder="Computer Science Department" />
                </label>

                <label>
                    Topic
                    <select>
                        <option>Schedule generation</option>
                        <option>Data management</option>
                        <option>Technical support</option>
                        <option>General question</option>
                    </select>
                </label>

                <label>
                    Message
                    <textarea rows="5" placeholder="Tell us what you need help with..."></textarea>
                </label>

                <button type="button">
                    Send message
                    <i class="bi bi-arrow-right"></i>
                </button>
            </form>
        </div>
    </div>
</section>
