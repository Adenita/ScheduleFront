<div class="container py-5">
  <div class="row">
    <div class="col-12">
      <div class="card text-center" style="background-color: #952323; color: #ffffff;">
        <div class="card-body">
          <h2>Welcome to the ScheduleComponent Generator</h2>
          <p>Explore our powerful scheduling tools to optimize your department's resources.</p>
        </div>
      </div>
    </div>
  </div>
  <div class="row mt-5">
    <div class="col-4">
      <div class="card h-100" style="background-color: #ffffff;">
        <div class="card-body text-center">
          <h2 style="color: #952323;">Generate New ScheduleComponent</h2>
          <button class="btn btn-danger" (click)="openGenerateModal()" [routerLink] = "['schedules']">Generate New ScheduleComponent</button>
        </div>
      </div>
    </div>
    <div class="col-4">
      <div class="card h-100" style="background-color: #ffffff;">
        <div class="card-body text-center">
          <h2 style="color: #952323;">Previous Schedules</h2>
          <ul class="list-group">
            <li class="list-group-item">ScheduleComponent 1</li>
            <li class="list-group-item">ScheduleComponent 2</li>
            <li class="list-group-item">ScheduleComponent 3</li>
          </ul>
        </div>
      </div>
    </div>
    <div class="col-4">
      <div class="card h-100" style="background-color: #ffffff;">
        <div class="card-body text-center">
          <h2 style="color: #952323;">Manage Department</h2>
          <button class="btn btn-danger">Department Data</button>
        </div>
      </div>
    </div>
  </div>
</div>
