<div class="hero-preview">
    <div class="preview-card main-preview-card">
        <div class="flex justify-between gap-4 mb-6">
            <div>
                <h5 class="mb-1 font-extrabold text-app-text">Generated Schedule</h5>
                <p class="m-0 text-sm text-slate-500">Computer Science · Semester 4</p>
            </div>

            <span class="status-pill">Optimized</span>
        </div>

        @for (row of schedulePreviewRows; track row.title) {
            <div class="schedule-preview-row {{ row.accent }}">
                <div>
                    <strong class="text-app-text">{{ row.title }}</strong>
                    <p>{{ row.details }}</p>
                </div>

                <span>{{ row.time }}</span>
            </div>
        }
    </div>

    <div class="floating-card conflicts-card">
        <i class="bi bi-shield-check gold-icon"></i>
        <div>
            <strong>Conflict check</strong>
            <p>Rooms, professors, and groups validated</p>
        </div>
    </div>

    <div class="floating-card calendar-card">
        <i class="bi bi-calendar-event blue-icon"></i>
        <div>
            <strong>Calendar sync</strong>
            <p>Export and integration coming soon</p>
        </div>
    </div>
</div>
