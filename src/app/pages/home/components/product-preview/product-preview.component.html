<section class="section product-section">
  <div class="flex flex-wrap items-center gap-5">
    <div class="lg:w-1/2">
      <span class="section-tag">Product preview</span>

      <h2>Designed for universities, departments, and academic staff.</h2>

      <p>
        ScheduleUP brings professors, subjects, rooms, groups, and generated schedules
        into one organized platform.
      </p>

      <div class="check-list">
        @for (item of checkListItems; track item) {
          <div>
            <i class="bi bi-check-circle-fill"></i>
            {{ item }}
          </div>
        }
      </div>
    </div>

    <div class="lg:w-1/2">
      <div class="dashboard-mockup">
        <div class="mockup-topbar">
          <span></span>
          <span></span>
          <span></span>
        </div>

        <div class="mockup-grid">
          <div class="mockup-sidebar">
            <div></div>
            <div></div>
            <div></div>
          </div>

          <div class="mockup-content">
            <div class="mockup-stat">
              <strong>94%</strong>
              <span>Schedule fit</span>
            </div>

            <div class="mockup-stat">
              <strong>12</strong>
              <span>Conflicts solved</span>
            </div>

            <div class="mockup-table">
              <div></div>
              <div></div>
              <div></div>
              <div></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
