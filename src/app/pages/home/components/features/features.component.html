<section class="px-4 py-20">
    <div class="mx-auto mb-12 max-w-3xl text-center">
        <h2 class="mb-3 text-3xl font-black  text-slate-950 md:text-4xl">
            What ScheduleUP does
        </h2>

        <p class="text-lg font-medium leading-6 text-slate-500">
            A lighter way to generate, manage, and publish university schedules.
        </p>
    </div>

    <div class="feature-grid">
        @for (feature of features; track feature.title) {
            <div class="feature-card">
                <div class="mb-6 flex items-start justify-between gap-4">
                    <span class="feature-badge">
                        {{ feature.badge }}
                    </span>

                    <div class="feature-icon">
                        <i class="bi {{ feature.icon }}"></i>
                    </div>
                </div>

                <h4 class="mb-2 text-lg  font-medium leading-5 text-black">
                    {{ feature.title }}
                </h4>

                <p class="text-base font-light leading-6 text-slate-500">
                    {{ feature.description }}
                </p>
            </div>
        }
    </div>
</section>
