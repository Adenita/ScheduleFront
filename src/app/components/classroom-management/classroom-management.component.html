<main>
  <div class = "container">
     <app-classroom-list [classrooms$]="classrooms$"></app-classroom-list>
    <div class="crud-buttons">
      <button (click)="openForm()">Add Classroom</button>
    </div>
  </div>

  <div class="form-container" *ngIf="showForm">
    <form [formGroup]="classroomForm">
      <div class="form-group">
        <label for="name">Name</label>
        <input class= "form-control" type="text" id="name" formControlName="name" placeholder="Classroom Name" >
      </div>
      <div class="form-group">
        <label for="numberOfSeats">Number of Seats</label>
        <input class= "form-control" type="number" id="numberOfSeats" formControlName="numberOfSeats" placeholder="Number of Seats">
      </div>
      <div class="form-group">
        <label for="hasComputers">Is Lab</label>
        <input type="checkbox" id="hasComputers" formControlName="hasComputers">
      </div>
      <button class= "save-button" (click)="postClassroom()">Add Classroom</button>
    </form>
  </div>
</main>
