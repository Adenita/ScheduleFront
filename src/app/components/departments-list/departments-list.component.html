<div class="container mt-5">
  <div class="row justify-content-end align-items-center my-2">
    <div class="col">
      <h5 class="mb-0">Department List</h5>
    </div>
    <div class="col-lg-auto">
      <button class="btn btn-sm btn-dark px-4" (click)="openForm()">Add</button>
    </div>
  </div>
  <div class="row">
    <div class="col-12">
      <div class="table-responsive" *ngIf="departments$; else noDepartmentsFound">
        <table class="table table-bordered table-striped table-hover">
          <thead class="thead-dark-red">
          <tr>
            <th>Name</th>
            <th>Actions</th>
          </tr>
          </thead>
          <tbody>
          <tr *ngFor="let department of departments$ | async">
            <td class="pe-5" [routerLink]="['/departments', department.id]">{{ department.name }} </td>
            <td class="d-flex justify-content-center">
              <button class="btn btn-sm btn-outline-dark me-1" (click)="openEditForm(department.id)">Edit</button>
              <button class="btn btn-sm btn-outline-danger" (click)="deleteDepartment(department.id)">Delete</button>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
      <ng-template #noDepartmentsFound>
        <p>No Departments Found.</p>
      </ng-template>
    </div>
  </div>
</div>

<div *ngIf="showForm" class="form-container">
  <form [formGroup]="departmentForm">
    <div class="mb-3">
      <label for="name" class="form-label">Name</label>
      <input type="text" id="name" class="form-control" formControlName="name" placeholder="Department Name">
    </div>
    <div *ngIf="isEditMode; else postingDepartment">
      <button class="btn btn-primary" (click)="updateDepartment(scheduleToBeEditedId)">Edit Department</button>
    </div>
    <ng-template #postingDepartment>
      <button class="btn btn-primary" (click)="postDepartment()">Add Department</button>
    </ng-template>
  </form>
</div>
