<header class="public-header">
  <nav class="navbar navbar-expand-lg navbar-light py-3">
    <div class="container d-flex">
      <a class="navbar-brand fs-3 fw-bold red-text" routerLink="/">
        <img class="logo" src="/assets/logo.png" alt="logo">
      </a>
      <div class="justify-content-end">
        <ul class="navbar-nav align-items-center">
          <li class="nav-item">
            <a class="nav-link fs-5" routerLink="/" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link fs-5" routerLink="/aboutus" routerLinkActive="active-link">About Us</a>
          </li>
          <li class="nav-item mt-1">
            <button type="button" class="btn btn-outline-danger ms-3 me-2" (click)="loginClick.emit()">Login</button>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>
