<header class="public-header">
  <div class="app-container">
    <nav class="public-navbar">
      <a class="brand" routerLink="/">
        <img class="brand-logo" src="/assets/logo.png" alt="ScheduleUP">
        <span class="brand-name">ScheduleUP</span>
      </a>

      <div class="nav-section">
        <a
          class="nav-item"
          routerLink="/"
          routerLinkActive="active-link"
          [routerLinkActiveOptions]="{ exact: true }">
          Home
        </a>

        <a
          class="nav-item"
          routerLink="/aboutus"
          routerLinkActive="active-link">
          About Us
        </a>

        <button
          type="button"
          class="login-btn"
          (click)="loginClick.emit()">
          Login
        </button>
      </div>
    </nav>
  </div>
</header>
