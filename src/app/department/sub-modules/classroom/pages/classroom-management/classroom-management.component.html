<div class = "container mt-5">
  <div class="row justify-content-end align-items-center my-2">
    <div class="col">
      <h5 class="mb-0">Classroom List</h5>
    </div>
    <div class="col-lg-auto">
      <button class= "btn btn-sm btn-dark px-4" (click)="openForm()">Add</button>
    </div>
  </div>
  <div class="row">
    <div class="col-12">
      <app-classroom-list [classrooms$]="classrooms$"></app-classroom-list>
    </div>
  </div>
</div>

<div class="form-container" *ngIf="showForm">
  <form [formGroup]="classroomForm">
    <div class="form-group">
      <label class="form-label" for="name">Name</label>
      <input class= "form-control" type="text" id="name" formControlName="name" placeholder="Classroom Name" >
    </div>
    <div class="form-group">
      <label class="form-label" for="numberOfSeats">Number of Seats</label>
      <input class= "form-control" type="number" id="numberOfSeats" formControlName="numberOfSeats" placeholder="Number of Seats">
    </div>
    <div class="form-group">
      <div class="form-check form-check-inline">
        <label class="form-check-label" for="hasComputers">Is Lab</label>
        <input class="form-check-input" type="checkbox" id="hasComputers" formControlName="hasComputers">
      </div>
    </div>
    <button class= "btn btn-primary" (click)="postClassroom()">Add Classroom</button>
  </form>
</div>
