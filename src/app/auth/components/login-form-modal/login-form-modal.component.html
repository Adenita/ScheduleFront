<div class="modal-dialog modal-dialog-centered">
  <div class="modal-content" style="border: 1px solid lightgray; border-radius: 10px;">
    <div class="modal-header" style="border-bottom: 1px solid lightgray;">
      <h4 class="modal-title fw-semibold text-center">Login</h4>
      <button type="button" class="btn-close" (click)="closeModal()" aria-label="Close" style="color: white;"></button>
    </div>
    <div class="modal-body overflow-y-scroll" style="max-height: 450px">
      <div class="form-container mt-1 px-5">
        <form [formGroup]="modalData.form">
          <div class="form-group mb-3">
            <label for="username" class="form-label">Username</label>
            <input class= "form-control" type="text" id="username" formControlName="username" placeholder="Username" >
          </div>
          <div class="form-group mb-3">
            <label for="password" class="form-label">Password</label>
            <input class= "form-control" type="text" id="password" formControlName="password" placeholder="Password" >
          </div>
        </form>
      </div>
    </div>
    <div class="modal-footer d-flex justify-content-between" >
      <button class="btn btn-outline-dark" (click)="closeModal()">Close</button>
      <div>
        <button class="btn btn-primary" (click)="onPostClick()"> Login </button>
      </div>
    </div>
  </div>
</div>
