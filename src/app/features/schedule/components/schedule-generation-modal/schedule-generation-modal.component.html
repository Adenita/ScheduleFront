<div class="mx-auto my-6 max-w-max flex min-h-[calc(100%_-_3rem)] items-center">
    <div class="h-full rounded-lg border border-slate-200 bg-white shadow-xl">
        <div class="flex items-center justify-between border-b border-slate-200 bg-white p-4">
            <h2 class="text-lg font-semibold text-slate-950">Schedule</h2>
        </div>
        <div class="bg-white p-4 overflow-auto modal-body-tall">
            <app-schedule [bestScheduleEvents$]="bestScheduleEvents$"></app-schedule>
            <div class="flex justify-center">
                <button
                    class="inline-flex items-center justify-center gap-2 rounded-md border border-transparent px-4 py-2 text-sm font-semibold leading-5 transition bg-blue-600 text-white hover:bg-blue-700 mr-2"
                    (click)="saveSchedule()"
                >
                    Save
                </button>
                <button
                    class="inline-flex items-center justify-center gap-2 rounded-md border border-transparent px-4 py-2 text-sm font-semibold leading-5 transition bg-slate-500 text-white hover:bg-slate-600"
                    (click)="closeModal()"
                >
                    Close
                </button>
            </div>
        </div>
    </div>
</div>
