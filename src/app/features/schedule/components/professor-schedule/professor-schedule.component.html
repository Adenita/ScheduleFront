<div class="mt-3" *ngIf="professorSchedulePerDayMap$ | async as professorSchedulePerDayMap">
  <ng-container *ngFor="let day of days">
    <div *ngIf="professorSchedulePerDayMap.has(day)">
      <h4 class="mt-2 font-semibold">Day | <span class="red-text">{{ day }}</span> </h4>
      <app-schedule [bestProgramSchedule]="professorSchedulePerDayMap.get(day) ?? emptyScheduleTransport"></app-schedule>
    </div>
  </ng-container>
</div>
