<div class="mt-3" *ngIf="classroomSchedulePerDayMap">
  <ng-container *ngFor="let day of days">
    <div *ngIf="classroomSchedulePerDayMap.has(day)">
      <h4 class="mt-2"><strong>{{ day}} </strong> </h4>
      <app-schedule [bestProgramSchedule]="classroomSchedulePerDayMap.get(day) ?? emptyScheduleTransport"></app-schedule>
    </div>
  </ng-container>
</div>
