<div *ngIf="!isSchedule" class="row align-items-start" style="margin-top: 2em;">
  <div class="col">
    <div style="margin-top: 10em;">
      <h2 class="fw-bold">Department Information</h2>
      <h3 class="fw-semibold mb-0">Name | <span class="red-text"> {{department$.getValue()?.name}} </span> </h3>
    </div>
  </div>
  <div class="col-auto d-flex align-items-start me-5">
    <div class="half-image-container"></div>
  </div>
</div>

<div class="row mt-2">
  <div class="card tab-card p-1">
    <div *ngIf="!isSchedule;" class="card-header rounded-3 box-shadow pb-4 pt-3 text-center">
      <ul class="nav nav-tabs card-header-tabs" id="myTab" role="tablist">
        <li class="nav-item">
          <a class="nav-link rounded-3 active" (click)="navigateToRoute('programs')" id="programs-tab" role="tab" data-bs-toggle="tab"  aria-controls="programs" aria-selected="true">Programs</a>
        </li>
        <li class="nav-item">
          <a class="nav-link rounded-3" (click)="navigateToRoute('professors')"  id="professors-tab" role="tab"  data-bs-toggle="tab"  aria-controls="professors" aria-selected="false">Professors</a>
        </li>
        <li class="nav-item">
          <a class="nav-link rounded-3"  (click)="navigateToRoute('subjects')"  id="subjects-tab" data-bs-toggle="tab"  role="tab" aria-controls="subjects" aria-selected="false">Subjects</a>
        </li>
        <li class="nav-item">
          <a class="nav-link rounded-3" (click)="navigateToRoute('classrooms')"  id="classrooms-tab"  data-bs-toggle="tab" role="tab" aria-controls="classrooms" aria-selected="false">Classrooms</a>
        </li>
        <li *ngIf="isAdmin" class="nav-item">
          <a class="nav-link rounded-3" (click)="navigateToRoute('student-groups')"  id="studentGroups-tab"  data-bs-toggle="tab"  role="tab" aria-controls="studentGroups" aria-selected="false">Student Groups</a>
        </li>
        <li *ngIf="isAdmin" class="nav-item">
          <a class="nav-link rounded-3" (click)="navigateToRoute('users')"  id="users-tab" data-bs-toggle="tab" role="tab" aria-controls="users" aria-selected="false">Users</a>
        </li>
      </ul>
    </div>

    <div class="card-body tab-content" id="myTabContent">
        <router-outlet></router-outlet>
    </div>
  </div>
</div>
