<div class="container mt-5">
  <div class="row justify-content-end align-items-center my-2">
    <div class="col">
      <h5 class="mb-0">Department List</h5>
    </div>
    <div *ngIf="isAdmin" class="col-lg-auto">
      <button class="btn btn-sm btn-dark px-4" (click)="openDepartmentFormModal()">Add</button>
    </div>
  </div>
  <div class="row">
    <div class="col-12">
      <div class="table-responsive" *ngIf="departments$.getValue().length > 0; else noDepartmentsFound">
        <table class="table table-bordered table-striped table-hover">
          <thead class="thead-dark-red">
          <tr>
            <th>Name</th>
            <ng-container *ngIf="isAdmin">
              <th>Creation Date</th>
              <th>Modification Date</th>
              <th>Actions</th>
            </ng-container>
          </tr>
          </thead>
          <tbody>
          <tr *ngFor="let department of departments$ | async">
            <td class="pe-5" [routerLink]="['/departments', department.id]">{{ department.name }} </td>
            <ng-container *ngIf="isAdmin">
              <td>{{ department.creationDate | date:dateFormat }}</td>
              <td>{{ department.modificationDate | date:dateFormat }}</td>
              <td class="d-flex justify-content-center">
                <button class="btn btn-sm btn-outline-dark me-1" (click)="openDepartmentFormModalInEditMode(department.id)">Edit</button>
                <button class="btn btn-sm btn-outline-danger" (click)="deleteDepartment(department.id)">Delete</button>
              </td>
            </ng-container>
          </tr>
          </tbody>
        </table>
      </div>
      <ng-template #noDepartmentsFound>
        <p>No Departments Found.</p>
      </ng-template>
    </div>
  </div>
</div>
