<div class = "table-responsive" *ngIf="professors$?.getValue() && professors$.getValue().length > 0; else noProfessorsFound">
  <table class="table table-bordered table-striped table-hover">
    <thead class="thead-dark-red">
    <tr>
      <th>Name</th>
      <th>Role</th>
      <th>Creation Date</th>
      <th>Modification Date</th>
      <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let professor of professors$ | async" >
      <td [routerLink]="route ? route + '/' + professor.id : null">{{ professor.name }}</td>
      <td>{{ professor.role }}</td>
      <td>{{ professor.creationDate | date: dateFormat}}</td>
      <td>{{ professor.modificationDate | date: dateFormat}}</td>
      <td class="d-flex justify-content-center">
        <button class="btn btn-sm btn-outline-dark me-1" (click)="onEditClick(professor.id)">Edit</button>
        <button class="btn btn-sm btn-outline-danger" (click)="onDeleteClick(professor.id)">Delete</button>
      </td>
    </tr>
    </tbody>
  </table>
</div>
<ng-template #noProfessorsFound>
  <p>No Professors Found.</p>
</ng-template>
