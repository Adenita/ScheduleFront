<div class = "table-responsive" *ngIf="programs$?.getValue() && programs$.getValue().length > 0; else noProgramsFound">
  <table class="table table-bordered table-striped table-hover overflow-scroll">
    <thead class="thead-dark-red">
    <tr>
      <th>Name</th>
      <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let program of programs$ | async" >
      <td [routerLink]="route ? route + '/' + program.id : null" >{{ program.name }}</td>
      <td class="d-flex justify-content-center">
        <button class="btn btn-sm btn-outline-dark me-1" (click)="onEditClick(program.id)">Edit</button>
        <button class="btn btn-sm btn-outline-danger" (click)="onDeleteClick(program.id)">Delete</button>
      </td>
    </tr>
    </tbody>
  </table>
</div>
<ng-template #noProgramsFound>
  <p>No Programs Found.</p>
</ng-template>
