<ng-container *ngIf="programId$.getValue() != -1 else showList">

  <div class="row mt-2">
    <div class="col-md-10">
      <router-outlet></router-outlet>
    </div>
    <div class="col-md-2 mt-2">
      <div class="card ">
        <div class="card-header box-shadow pt-3 text-center rounded-3 " style="background: #ce2a2d; color: white;">
          <h4>Programs</h4>
        </div>
        <div class="card-body p-1 mt-2">
          <div class="d-flex flex-column">
            <button *ngFor="let program of programs$ | async"
                    class="btn btn-outline-dark mb-2"
                    [class.active]="selectedProgram$.getValue().id === program.id"
                    (click)="selectProgram(program)">
              {{program.name}}
            </button>
            <ng-container *ngIf="isAdmin">
              <button class= "btn btn-danger me-1 px-4" (click)="openProgramFormModal()">Add</button>
            </ng-container>
          </div>
        </div>
      </div>
    </div>
  </div>

</ng-container>
<ng-template #showList>
  <div  *ngIf="programId$.getValue() == -1" class="container mt-5">
    <div class="row justify-content-end align-items-center my-2">
      <div class="col">
        <h5 class="mb-0 lead fw-normal">Programs List</h5>
      </div>
      <div *ngIf="isAdmin" class="col-lg-auto">
        <button class= "btn btn-sm btn-dark px-4" (click)="openProgramFormModal()">Add</button>
      </div>
    </div>

    <div class="row">
      <div class="col-12">
        <app-program-list
          [programs$]="programs$"
          [isAdmin]="isAdmin"
          [route]="route"
          (editEvent)="openProgramFormModalInEditMode($event)"
          (deleteEvent)="deleteProgram($event)"
        ></app-program-list>
      </div>
    </div>
  </div>
</ng-template>
