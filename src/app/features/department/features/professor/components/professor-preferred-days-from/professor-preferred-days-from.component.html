<div class="mx-auto w-[90%] max-w-none max-[992px]:w-full max-[992px]:px-4 mt-4">
  <div class="flex flex-wrap mb-3 border-b border-slate-200">
    <div class="md:w-2/3">
      <h4 class="text-xl leading-relaxed font-normal">Professor Preferred Days</h4>
    </div>
    <div class="md:w-1/3 mb-3 flex justify-end">
      <button type="button" class="inline-flex items-center justify-center gap-2 rounded-md border border-transparent px-4 py-2 text-sm font-semibold leading-5 transition px-3 py-1.5 text-xs bg-slate-950 text-white hover:bg-slate-800 rounded-lg" (click)="openModal()">Add</button>
    </div>
  </div>
  <form>
    <div class="form-group">
      <ng-container *ngFor="let preferredDay of professorPreferredDays$ | async">
        <div class="flex flex-wrap gap-1 mb-1 items-center">
          <div class="md:w-1/6 separator mr-2">
            <label class="font-normal red-text text-xl leading-relaxed italic">{{ preferredDay.day }}:</label>
          </div>
          <div class="md:w-1/12">
            <input type="number" class="block w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-950 outline-none transition placeholder:text-slate-400 focus:border-slate-950 focus:ring-2 focus:ring-slate-200" name="preferredStartHour"
                   [value]="preferredDay.preferredStartHour"
                   min="8" max="19" required disabled>
          </div>
          <div class="md:w-1/12 separator text-center">
            <span>:</span>
          </div>
          <div class="md:w-1/12">
            <input type="number" class="block w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-950 outline-none transition placeholder:text-slate-400 focus:border-slate-950 focus:ring-2 focus:ring-slate-200" name="preferredStartMinute"
                   [value]="preferredDay.preferredStartMinute"
                   min="0" max="45" step="15" required disabled>
          </div>
          <div class="md:w-1/12 separator text-center">
            <span>-</span>
          </div>
          <div class="md:w-1/12">
            <input type="number" class="block w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-950 outline-none transition placeholder:text-slate-400 focus:border-slate-950 focus:ring-2 focus:ring-slate-200" name="preferredEndHour"
                   [value]="preferredDay.preferredEndHour"
                   min="9" max="20" required disabled>
          </div>
          <div class="md:w-1/12 separator text-center">
            <span>:</span>
          </div>
          <div class="md:w-1/12">
            <input type="number" class="block w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-950 outline-none transition placeholder:text-slate-400 focus:border-slate-950 focus:ring-2 focus:ring-slate-200" name="preferredEndMinute"
                   [value]="preferredDay.preferredEndMinute"
                   min="0" max="45" step="15" required disabled>
          </div>
          <div class="w-auto flex justify-end ml-2">
            <button type="button" class="inline-flex items-center justify-center gap-2 rounded-md border border-transparent px-4 py-2 text-sm font-semibold leading-5 transition border-slate-900 text-slate-950 hover:bg-slate-950 hover:text-white mr-1" (click)="openEditModal(preferredDay.day)">Edit</button>
            <button type="button" class="inline-flex items-center justify-center gap-2 rounded-md border border-transparent px-4 py-2 text-sm font-semibold leading-5 transition bg-[var(--app-red)] text-white hover:bg-red-700" (click)="deleteProfessorPreferredDay(professorId, preferredDay.day)">Delete</button>
          </div>
        </div>
      </ng-container>

    </div>
  </form>

</div>
