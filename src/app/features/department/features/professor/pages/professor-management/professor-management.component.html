<ng-container  *ngIf="showProfessorDetails(); else showList">
  <div class="flex flex-wrap mt-2">
    <div class="md:w-5/6">
      <router-outlet></router-outlet>
    </div>
    <div class="md:w-1/6 mt-2">
      <div class="rounded-lg border border-slate-200 bg-white">
        <div class="border-b border-slate-200 bg-white shadow-sm pt-3 text-center rounded-lg red-panel-header">
          <h4>Professors</h4>
        </div>
        <div class="p-1 mt-1">
          <div class="mb-2 mx-1 rounded-lg subtle-border">
            <input type="text" class="block w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-950 outline-none transition placeholder:text-slate-400 focus:border-slate-950 focus:ring-2 focus:ring-slate-200" placeholder="Search professor " (input)="onSearch($event)">
          </div>
          <div class="flex flex-col overflow-y-scroll my-2 border-b border-slate-200 border-t custom-scroll">
            <button *ngFor="let professor of filteredProfessors$ | async"
                    class="inline-flex items-center justify-center gap-2 rounded-md border border-transparent px-4 py-2 text-sm font-semibold leading-5 transition border-slate-900 text-slate-950 hover:bg-slate-950 hover:text-white mr-2 mb-2"
                    [class.active]="professorId$.getValue() === professor.id"
                    (click)="selectProfessor(professor)">
              {{professor.name}}
            </button>
            <ng-container *ngIf="isAdmin">
              <button class="inline-flex items-center justify-center gap-2 rounded-md border border-transparent px-4 py-2 text-sm font-semibold leading-5 transition bg-[var(--app-red)] text-white hover:bg-red-700 mr-1" (click)="openProfessorFormModal()">Add</button>
            </ng-container>
          </div>
        </div>
      </div>
    </div>
  </div>
</ng-container>

<ng-template #showList>
  <div class="mx-auto w-[90%] max-w-none max-[992px]:w-full max-[992px]:px-4 mt-3">
    <div class="flex flex-wrap justify-end items-center my-2">
      <div class="flex-1 basis-0">
        <h5 class="mb-0 text-xl leading-relaxed font-normal">Professor List</h5>
      </div>
      <div class="searchbar">
        <input class="search_input" type="text" name="" (input)="onSearch($event)" placeholder="Search...">
        <span class="search_icon"><i class="bi bi-search"></i></span>
      </div>
      <div *ngIf="isAdmin" class="lg:w-auto">
        <button class="inline-flex items-center justify-center gap-2 rounded-md border border-transparent px-4 py-2 text-sm font-semibold leading-5 transition px-3 py-1.5 text-xs bg-slate-950 text-white hover:bg-slate-800" (click)="openProfessorFormModal()">Add</button>
      </div>
    </div>
    <div class="flex flex-wrap">
      <div class="w-full">
        <app-professor-list
          [professors$]="filteredProfessors$"
          [isAdmin]="isAdmin"
          [route]="route"
          (editEvent)="openProfessorFormModalInEditMode($event)"
          (deleteEvent)="deleteProfessor($event)"
        ></app-professor-list>
      </div>
    </div>
  </div>
</ng-template>
