<ng-container  *ngIf="programId == -1; else showList">
    <div class="pt-4 pb-3 ps-3 my-2 box-shadow1 rounded-3 d-flex justify-content-between align-items-center">
      <div class="ps-2 flex-column align-items-center">
        <h4 class="fw-bold mb-2 fs-4">Professor Details</h4>
        <h5 class="lead fw-normal"> Name | <span class="red-text">{{ selectedProfessor$.getValue()?.name }} </span> </h5>
        <h5 class="lead fw-normal"> Rank | <span class="red-text"> {{ selectedProfessor$.getValue()?.rank }} </span>  </h5>
        <h6 class="fst-italic fw-light mt-3">View more professor details down below </h6>
      </div>
      <div *ngIf="isAdmin" class="col-lg-auto d-flex justify-content-end me-3">
        <button class="btn btn-sm btn-outline-dark me-1" (click)="openProfessorFormModalInEditMode(selectedProfessor$.getValue().id)">Edit</button>
        <button class="btn btn-sm btn-outline-danger" (click)="deleteProfessor(selectedProfessor$.getValue().id)">Delete</button>
      </div>
</div>

  <div class="row">
    <div class="col-md-10">
      <router-outlet></router-outlet>
    </div>
    <div class="col-md-2 mt-2">
      <div class="card ">
        <div class="card-header box-shadow pt-2 text-center rounded-3">
          <h4>Professors</h4>
        </div>
        <div class=" p-1 mt-3">
          <div class="mb-2">
            <input type="text" class="form-control" placeholder="Search professor " (input)="onSearch($event)">
          </div>
          <div class="d-flex flex-column overflow-y-scroll my-2 border-bottom border-top custom-scroll">
            <button *ngFor="let professor of filteredProfessors$ | async"
                    class="btn btn-outline-dark me-2 mb-2"
                    [class.active]="selectedProfessor$.getValue().id === professor.id"
                    (click)="selectProfessor(professor)">
              {{professor.name}}
            </button>
            <ng-container *ngIf="isAdmin">
              <button class= "btn btn-danger me-1 px-4" (click)="openProfessorFormModal()">Add</button>
            </ng-container>
          </div>
        </div>
      </div>
    </div>
  </div>
</ng-container>

<ng-template #showList>
  <div class="mt-3">
    <div class="row justify-content-end align-items-center my-2">
      <div class="col">
        <h5 class="mb-0 lead fw-normal">Professor List</h5>
      </div>
      <div class="searchbar">
        <input class="search_input" type="text" name="" (input)="onSearch($event)" placeholder="Search...">
        <span class="search_icon"><i class="bi bi-search"></i></span>
      </div>
      <div *ngIf="isAdmin" class="col-lg-auto">
        <button class= "btn btn-sm btn-dark px-4" (click)="openProfessorFormModal()">Add</button>
      </div>
    </div>
    <div class="row">
      <div class="col-12">
        <app-professor-list
          [professors$]="filteredProfessors$"
          [isAdmin]="isAdmin"
          [route]="route"
          (editEvent)="openProfessorFormModalInEditMode($event)"
          (deleteEvent)="deleteProfessor($event)"
        ></app-professor-list>
      </div>
    </div>
  </div>
</ng-template>
