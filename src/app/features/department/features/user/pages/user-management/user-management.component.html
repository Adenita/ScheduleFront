<div class="mx-auto w-[90%] max-w-none max-[992px]:w-full max-[992px]:px-4 mt-12">
    <div class="flex flex-wrap justify-end items-center my-2">
        <div class="flex-1 basis-0">
            <h5 class="mb-0">Users List</h5>
        </div>
        <div class="lg:w-auto">
            <button
                class="inline-flex items-center justify-center gap-2 rounded-md border border-transparent px-4 py-2 text-sm font-semibold leading-5 transition px-3 py-1.5 text-xs border-slate-900 text-slate-950 hover:bg-slate-950 hover:text-white"
                (click)="openUserFormModal()"
            >
                Add
            </button>
        </div>
    </div>

    <div class="flex flex-wrap">
        <div class="w-full">
            <app-user-list
                [users$]="users$"
                [route]="route"
                (editEvent)="openUserFormModalInEditMode($event)"
                (deleteEvent)="deleteUser($event)"
            ></app-user-list>
        </div>
    </div>
</div>
