<div class = "table-responsive" *ngIf="classrooms$?.getValue() && classrooms$.getValue().length > 0; else noClassroomsFound">
  <table class="table table-bordered table-striped table-hover overflow-scroll">
    <thead class="thead-dark-red">
    <tr>
      <th>Name</th>
      <th>Seats</th>
      <th>Lab</th>
      <ng-container *ngIf="isAdmin">
        <th>Creation Date</th>
        <th>Modification Date</th>
        <th>Actions</th>
      </ng-container>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let classroom of classrooms$ | async">
      <td>{{ classroom.name }}</td>
      <td>{{ classroom.numberOfSeats }}</td>
      <td>{{ classroom.hasComputers }}</td>
      <ng-container *ngIf="isAdmin">
        <td>{{ classroom.creationDate | date: dateFormat}}</td>
        <td>{{ classroom.modificationDate | date: dateFormat}}</td>
        <td class="d-flex justify-content-center">
          <button class="btn btn-sm btn-outline-dark me-1" (click)="onEditClick(classroom.id)">Edit</button>
          <button class="btn btn-sm btn-outline-danger" (click)="onDeleteClick(classroom.id)">Delete</button>
        </td>
      </ng-container>
    </tr>
    </tbody>
  </table>
</div>
<ng-template #noClassroomsFound>
  <p>No Classrooms Found.</p>
</ng-template>
