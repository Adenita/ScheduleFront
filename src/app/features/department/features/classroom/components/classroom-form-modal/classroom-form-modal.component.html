<div class="modal-dialog modal-dialog-centered">
  <div class="modal-content" style="border: 1px solid lightgray; border-radius: 10px;">
    <div class="modal-header" style="border-bottom: 1px solid lightgray;">
      <h4 class="modal-title fw-semibold text-center">Classroom Form</h4>
      <button type="button" class="btn-close" (click)="closeModal()" aria-label="Close" style="color: white;"></button>
    </div>
    <div class="modal-body overflow-y-scroll" style="max-height: 450px">
      <div class="form-container mt-1 px-5">
        <form [formGroup]="modalData.form">
          <div class="form-group">
            <label class="form-label" for="name">Name</label>
            <input class= "form-control" type="text" id="name" formControlName="name" placeholder="Classroom Name" >
          </div>
          <div class="form-group">
            <label class="form-label" for="numberOfSeats">Number of Seats</label>
            <input class= "form-control" type="number" id="numberOfSeats" formControlName="numberOfSeats" placeholder="Number of Seats">
          </div>
          <div class="form-group">
            <div class="form-check form-check-inline">
              <label class="form-check-label" for="hasComputers">Is Lab</label>
              <input class="form-check-input" type="checkbox" id="hasComputers" formControlName="hasComputers">
            </div>
          </div>
        </form>
      </div>
    </div>
    <div class="modal-footer d-flex justify-content-between" >
      <button class="btn btn-outline-dark" (click)="closeModal()">Close</button>
      <div *ngIf="modalData.isEditMode; else postingClassroom">
        <button class="btn btn-primary" (click)="onUpdateClick(modalData.selectedId)">Edit Classroom</button>
      </div>
      <ng-template #postingClassroom>
        <button class= "btn btn-primary" (click)="onPostClick()">Add Classroom</button>
      </ng-template>
    </div>
  </div>
</div>
