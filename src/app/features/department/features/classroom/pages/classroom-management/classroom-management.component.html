<div class="mx-auto w-[90%] max-w-none max-[992px]:w-full max-[992px]:px-4 mt-3">
  <div class="flex flex-wrap justify-end items-center my-2">
    <div class="flex-1 basis-0">
      <h5 class="mb-0 text-xl leading-relaxed font-normal">Classroom List</h5>
    </div>
    <div class="searchbar mr-2">
      <input class="search_input" type="text" name="" (input)="onSearch($event)" placeholder="Search...">
      <span class="search_icon"><i class="bi bi-search"></i></span>
    </div>
    <div *ngIf="isAdmin" class="lg:w-auto">
      <button class="inline-flex items-center justify-center gap-2 rounded-md border border-transparent px-4 py-2 text-sm font-semibold leading-5 transition px-3 py-1.5 text-xs bg-slate-950 text-white hover:bg-slate-800" (click)="openClassroomFormModal()">Add</button>
    </div>
</div>

<div class="flex flex-wrap">
  <div class="w-full">
    <app-classroom-list
      [classrooms$]="filteredClassrooms$"
      [isAdmin] = "isAdmin"
      (editEvent)="openClassroomFormModalInEditMode($event)"
      (deleteEvent)="deleteClassroom($event)"
    ></app-classroom-list>
  </div>
</div>
</div>
