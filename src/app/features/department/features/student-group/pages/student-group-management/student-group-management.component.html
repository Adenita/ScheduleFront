<div class = "container mt-5">
  <div class="row justify-content-end align-items-center my-2">
    <div class="col">
      <h5 class="mb-0">Student Group List</h5>
    </div>
    <div class="col-lg-auto">
      <button class= "btn btn-sm btn-dark px-4" (click)="openStudentGroupFormModal()">Add</button>
    </div>
  </div>

  <div class="row">
    <div class="col-12">
      <app-student-group-list
        [studentGroups$]="studentGroups$"
        [route]="route"
        (editEvent)="openStudentGroupFormModalInEditMode($event)"
        (deleteEvent)="deleteStudentGroup($event)"
      ></app-student-group-list>
    </div>
  </div>
</div>
