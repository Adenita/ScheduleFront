<div class="mx-auto w-[90%] max-w-none max-[992px]:w-full max-[992px]:px-4 mt-12">
    <div class="flex flex-wrap justify-end items-center my-2">
        <div class="flex-1 basis-0">
            <h5 class="mb-0">Student Group List</h5>
        </div>
        <div *ngIf="isAdmin" class="lg:w-auto">
            <button
                class="inline-flex items-center justify-center gap-2 rounded-md border border-transparent px-4 py-2 text-sm font-semibold leading-5 transition px-3 py-1.5 text-xs bg-slate-950 text-white hover:bg-slate-800"
                (click)="openStudentGroupFormModal()"
            >
                Add
            </button>
        </div>
    </div>

    <div class="flex flex-wrap">
        <div class="w-full">
            <app-student-group-list
                [studentGroups$]="studentGroups$"
                [isAdmin]="isAdmin"
                [route]="route"
                (editEvent)="openStudentGroupFormModalInEditMode($event)"
                (deleteEvent)="deleteStudentGroup($event)"
            ></app-student-group-list>
        </div>
    </div>
</div>
