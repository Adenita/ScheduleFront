<div class="mx-auto w-[90%] max-w-none max-[992px]:w-full max-[992px]:px-4">
    <div class="flex flex-wrap mt-4">
        <div class="flex-1 basis-0 text-center">
            <h2><strong>Subject Information</strong></h2>
            <h3><strong>Name:</strong> {{ subject.name }}</h3>
        </div>
    </div>
    <div class="flex flex-wrap mt-4 border-b border-slate-200">
        <div class="md:w-1/3">
            <div class="description-box p-3">
                <h3>Student Groups Preview</h3>
                <p class="mb-2"><strong>Student Groups count:</strong> 10</p>
                <p class="mb-2"><strong>Last updated:</strong> October 1, 2023</p>
                <button
                    class="inline-flex items-center justify-center gap-2 rounded-md border border-transparent px-4 py-2 text-sm font-semibold leading-5 transition bg-slate-950 text-white hover:bg-slate-800"
                    [routerLink]="[currentRoute, 'student_groups']"
                >
                    View All
                </button>
            </div>
        </div>
        <div class="md:w-2/3">
            <div>
                <app-student-group-list [studentGroups$]="previewStudentGroups$"></app-student-group-list>
            </div>
        </div>
    </div>
    <div class="flex flex-wrap mt-4 border-b border-slate-200">
        <div class="md:w-1/3">
            <div class="description-box p-3">
                <h3>Professors Preview</h3>
                <p class="mb-2"><strong>Professors count:</strong> 10</p>
                <p class="mb-2"><strong>Last updated:</strong> October 1, 2023</p>
                <button
                    class="inline-flex items-center justify-center gap-2 rounded-md border border-transparent px-4 py-2 text-sm font-semibold leading-5 transition bg-slate-950 text-white hover:bg-slate-800"
                    [routerLink]="[currentRoute, 'professors']"
                >
                    View All
                </button>
            </div>
        </div>
        <div class="md:w-2/3">
            <div>
                <app-professor-list [professors$]="previewProfessors$"></app-professor-list>
            </div>
        </div>
    </div>
</div>
