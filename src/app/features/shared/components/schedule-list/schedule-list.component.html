<div class = "table-responsive" *ngIf="schedules$?.getValue() && schedules$.getValue().length > 0; else noClassroomsFound">
  <table class="table table-bordered table-striped table-hover overflow-scroll">
    <thead class="thead-dark-red">
    <tr>
      <th>Semester</th>
      <th>Creation Date</th>
      <th *ngIf="isAdmin">Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let schedule of schedules$ | async">
      <td>{{ schedule.semester }}</td>
      <td>{{ schedule.creationDate | date: dateFormat}}</td>
      <td *ngIf="isAdmin" class="d-flex justify-content-center">
        <button class="btn btn-sm btn-outline-dark me-1" (click)="onEditClick(schedule.id)">Edit</button>
        <button class="btn btn-sm btn-outline-danger" (click)="onDeleteClick(schedule.id)">Delete</button>
      </td>
    </tr>
    </tbody>
  </table>
</div>
<ng-template #noClassroomsFound>
  <p>No Schedules Found.</p>
</ng-template>
