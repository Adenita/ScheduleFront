<header class = "bg-light">
  <div class="container">
    <nav class="navbar navbar-expand-lg navbar-light bg-light py-3">
      <div class="container d-flex justify-content-between">
        <a class="navbar-brand fs-3 fw-bold " routerLink="/" style="color: #952323">Schedule Generator</a>
        <div class="navbar-nav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link text-dark fs-5" routerLink="/">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-dark fs-5" routerLink="/departments">Details</a>
            </li>
          </ul>
        </div>
        <div *ngIf="!isLoggedIn; else LoggedIn" >
          <a class="btn btn-outline-danger me-2"  (click)="openLoginModalData()">Login</a>
        </div>
        <ng-template #LoggedIn>
          <div>
            <span routerLink="/profile" class="navbar-text">{{ username }} | </span>
            <button class="btn btn-danger me-2" (click)="logout()">Logout</button>
          </div>
        </ng-template>
      </div>
    </nav>
  </div>
</header>
<main class="container" style=" margin-bottom: 250px">
  <router-outlet></router-outlet>
</main>
<footer class="bg-dark fixed-bottom py-4">
  <div class="container d-flex justify-content-center">
    <ul class="nav">
      <li class="nav-item"><a class="nav-link text-white">About Us</a></li>
      <li class="nav-item"><a class="nav-link text-white" >Contact</a></li>
      <li class="nav-item"><a class="nav-link text-white" >Privacy Policy</a></li>
    </ul>
  </div>
</footer>
