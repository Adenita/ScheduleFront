<header class = "bg-light">
  <div class="container">
    <nav class="navbar navbar-expand-lg navbar-light py-3">
      <div class="container d-flex ">
        <a class="navbar-brand fs-3 fw-bold red-text " routerLink="/">ScheduleUP</a>
        <div class="justify-content-end">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link text-dark fs-5" routerLink="/">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-dark fs-5" routerLink="/departments">Details</a>
            </li>
            <li class="nav-item">
              <select class="nav-link form-select-sm border-0 bg-light fs-5" (click)="onScheduleChange($event)">
                <option value="" disabled selected>Schedules</option>
                <option *ngFor="let department of departments | async" value="{{department.id}}">{{department.name}}</option>
              </select>
            </li>
            <li class="nav-item">
              <a class="nav-link text-dark fs-5" routerLink="/aboutus">About Us</a>
            </li>
            <div class="nav-item mt-1" *ngIf="!isLoggedIn; else LoggedIn" >
              <a class="btn btn-outline-danger ms-3 me-2"  (click)="openLoginModalData()">Login</a>
            </div>
            <ng-template #LoggedIn>
              <div>
                <span routerLink="/profile" class="navbar-text">{{ username }} | </span>
                <button class="btn btn-danger me-2" (click)="logout()">Logout</button>
              </div>
            </ng-template>
          </ul>
        </div>
      </div>
    </nav>
  </div>
</header>
<main class="container">
  <router-outlet></router-outlet>
</main>
<footer class="bg-dark fixed-bottom py-4">
  <div class="container d-flex justify-content-center">
    <ul class="nav">
      <li class="nav-item"><a class="nav-link text-white">About Us</a></li>
      <li class="nav-item"><a class="nav-link text-white" >Contact</a></li>
      <li class="nav-item"><a class="nav-link text-white" >Privacy Policy</a></li>
    </ul>
  </div>
</footer>
