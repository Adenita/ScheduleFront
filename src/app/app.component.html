<header class = "bg-light">
  <nav class="navbar navbar-expand-lg navbar-light py-3">
    <div class="container d-flex ">
      <a class="navbar-brand fs-3 fw-bold red-text " routerLink="/">
        <img class="logo" src="/assets/logo.png" alt="logo">
      </a>
      <div class="justify-content-end">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link fs-5" routerLink="/" routerLinkActive="active-link"  [routerLinkActiveOptions]="{exact: true}" >Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link fs-5" routerLink="/departments" appCustomRouterLinkActive >Details</a>
          </li>
          <li class="nav-item">
            <select class="nav-link form-select-sm border-0 bg-light fs-5 " (change)="onScheduleChange($event)">
              <option value="" disabled selected>Schedules</option>
              <option *ngFor="let department of departments | async" [value]="department.id"  [ngClass]="{ 'active-link': department.id === selectedDepartmentId }">{{department.name}}</option>
            </select>
          </li>
          <li class="nav-item">
            <a class="nav-link fs-5" routerLink="/aboutus" routerLinkActive="active-link">About Us</a>
          </li>
          <li *ngIf="isLoggedIn" class="nav-item">
            <a class="nav-link  fs-5" routerLink="/schedules/generate" routerLinkActive="active-link">Generate Schedule</a>
          </li>
          <div class="nav-item mt-1" *ngIf="!isLoggedIn; else LoggedIn" >
            <a class="btn btn-outline-danger ms-3 me-2"  (click)="openLoginModalData()">Login</a>
          </div>
          <ng-template #LoggedIn>
            <div class="mt-2">
              <span [routerLink]="['users/profile']"  routerLinkActive="active-link" class="navbar-text   fw-bold ms-3 fs-5">{{ username }} | </span>
              <button class="btn btn-danger  me-2" (click)="logout()">Logout</button>
            </div>
          </ng-template>
        </ul>
      </div>
    </div>
  </nav>
</header>
<main class="container">
  <router-outlet></router-outlet>
</main>
<footer class="bg-dark fixed-bottom py-4">
  <div class="container d-flex justify-content-center">
    <ul class="nav">
      <li class="nav-item"><a class="nav-link text-white">About Us</a></li>
      <li class="nav-item"><a class="nav-link text-white" >Contact</a></li>
      <li class="nav-item"><a class="nav-link text-white" >Privacy Policy</a></li>
    </ul>
  </div>
</footer>
