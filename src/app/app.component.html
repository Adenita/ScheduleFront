<ng-container *ngIf="!isLoggedIn; else appShell">
  <app-header-bar></app-header-bar>

  <main class="container public-main">
    <router-outlet></router-outlet>
  </main>

  <footer class="bg-dark py-4">
    <div class="container d-flex justify-content-center">
      <ul class="nav">
        <li class="nav-item"><a class="nav-link text-white" routerLink="/aboutus">About Us</a></li>
        <li class="nav-item"><a class="nav-link text-white">Contact</a></li>
        <li class="nav-item"><a class="nav-link text-white">Privacy Policy</a></li>
      </ul>
    </div>
  </footer>
</ng-container>

<ng-template #appShell>
  <div class="app-shell" [class.sidebar-collapsed]="isSidebarCollapsed">
    <app-sidebar
      [collapsed]="isSidebarCollapsed"
      [isAdmin]="isAdmin"
      [isProfessor]="isProfessor"
      [username]="username"
      [currentUser]="currentUser"
      (toggleSidebar)="toggleSidebar()"
      (logoutClick)="logout()"></app-sidebar>

    <main class="app-main">
      <router-outlet></router-outlet>
    </main>
  </div>
</ng-template>
