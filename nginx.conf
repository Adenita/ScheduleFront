server {
    listen 80;

    # Specify the domain name or IP address for your application
    server_name localhost;

    # Define the location to proxy requests to your Angular application
    location / {
        proxy_pass http://angular-app:8080;  # Assuming "angular-app" is the name of your Angular Docker container
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Additional configurations can be added here if necessary
}
